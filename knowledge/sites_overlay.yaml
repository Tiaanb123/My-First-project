# Hand-maintained overrides merged into the generated knowledge/sites.yaml by
# `python -m reportgen.build_sites`. Everything the site lookup workbook does NOT carry
# lives here: GlideView airport-name matching and which BHS product a site uses.
#
# Keys are site codes (CS Client minus the _APAC suffix).

overrides:
  ZQN:
    airport_name: "Queenstown International Airport"
    bhs_source: glideview
    # Part B "Prepared for" line (BHS Performance Review). Omit when unknown - never guess.
    prepared_for: "Sean Whittaker, Queenstown Airport"
    prepared_for_cc: "Blair Poland, National Support Services Manager, Alstef Group"
  CHC:
    airport_name: "Christchurch International Airport"
    bhs_source: glideview
    prepared_for: "Blair Poland, National Support Services Manager"
  DUD:
    airport_name: "Dunedin International Airport"
  ADL:
    airport_name: "Adelaide Airport"
    bhs_source: baganalytics
  AMX:
    # Every other Parcels site in the lookup workbook is Australian (regions.py defaults
    # Parcels sites to Australia); Aramex is the one exception - flagged by Tiaan on the
    # 7-13 Sep report, corrected here rather than in the Parcels-country default.
    country: "New Zealand"
